name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: ""
            targets: Audiosphere_VST3 Audiosphere_Standalone
          - name: macOS
            os: macos-14
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            targets: Audiosphere_VST3 Audiosphere_AU Audiosphere_Standalone
          - name: Linux
            os: ubuntu-22.04
            cmake_args: -DAUDIOSPHERE_BUILD_RENDER_TOOL=ON
            targets: Audiosphere_VST3 Audiosphere_Standalone AudiosphereRender

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target ${{ matrix.targets }}

      - name: Render and check every factory preset
        if: runner.os == 'Linux'
        run: ./build/AudiosphereRender_artefacts/Release/AudiosphereRender

      - name: Validate VST3 with pluginval
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process \
            --validate build/Audiosphere_artefacts/Release/VST3/Audiosphere.vst3

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ART=build/Audiosphere_artefacts/Release
          cp -R "$ART/VST3/Audiosphere.vst3" dist/
          if [ -d "$ART/AU/Audiosphere.component" ]; then cp -R "$ART/AU/Audiosphere.component" dist/; fi
          if [ -d "$ART/Standalone/Audiosphere.app" ]; then cp -R "$ART/Standalone/Audiosphere.app" dist/; fi
          if [ -f "$ART/Standalone/Audiosphere.exe" ]; then cp "$ART/Standalone/Audiosphere.exe" dist/; fi
          if [ -f "$ART/Standalone/Audiosphere" ]; then cp "$ART/Standalone/Audiosphere" dist/; fi
          cp README.md dist/

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath Audiosphere-${{ matrix.name }}.zip

      - name: Zip (macOS / Linux)
        if: runner.os != 'Windows'
        run: cd dist && zip -qry ../Audiosphere-${{ matrix.name }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Audiosphere-${{ matrix.name }}
          path: Audiosphere-${{ matrix.name }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Audiosphere-${{ matrix.name }}.zip
